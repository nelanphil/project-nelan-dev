services:
  # Backend Web Service
  - type: web
    name: nelan-dev-backend
    rootDir: server
    env: node
    buildCommand: yarn install && yarn build
    startCommand: yarn start
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is automatically provided by Render
      # CORS_ORIGIN should be set to your frontend static site URL
      # Example: https://nelan-dev.onrender.com
      # SUPABASE_URL should be set to your Supabase project URL
      # SUPABASE_SERVICE_ROLE_KEY should be set to your Supabase service role key

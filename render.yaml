services:
  # Backend Web Service
  - type: web
    name: nelan-dev-backend
    rootDir: server
    env: node
    buildCommand: NODE_ENV=development yarn install && yarn build
    startCommand: yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://nelan-dev.onrender.com
      - key: MONGO_URI_DEVELOPMENT
        sync: false # set via dashboard
      - key: MONGO_URI_PRODUCTION
        sync: false # set via dashboard
      - key: JWT_SECRET
        sync: false # set via dashboard
      # PORT is automatically provided by Render
